# Deploy the repository root to GitHub Pages
# Publishes index.html from the repository root. Run on pushes to main and manually.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload Pages artifact
        # Use a non-deprecated release of the upload-pages-artifact action
        uses: actions/upload-pages-artifact@v2
        with:
          # Publish the repository root ('.') so index.html at repo root is served.
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1